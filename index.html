<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório de Hospedagem · ArkMotionResidence</title>
  <meta name="description" content="Relatório da hospedagem de 10 a 12 de outubro na ArkMotionResidence Pool&Kite, perto de Flecheiras.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero__inner">
      <p class="eyebrow">Relatório de hospedagem</p>
      <h1 id="titulo">Carregando…</h1>
      <p class="hero__sub" id="tipo"></p>
      <ul class="chips" id="chips"></ul>
      <a class="btn" id="anuncio" href="#" target="_blank" rel="noopener">Ver anúncio original</a>
    </div>
  </header>

  <main>
    <section class="resumo" id="resumo" aria-label="Resumo da estadia"></section>
    <div id="secoes"></div>
  </main>

  <footer class="footer">
    <p>Relatório elaborado após a estadia, com observações para ajudar a melhorar a experiência dos próximos hóspedes.</p>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close" aria-label="Fechar">×</button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
